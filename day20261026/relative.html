<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>相对定位</title>
    <style>
        #dv{
            /* 相对定位   相对于该元素没有加定位时候的默认位置进行定位 */
            position: relative;
            left: 100px;
            top: 100px;
            width: 200px;
            height: 200px;
            background-color: blue;
            color: white;
        }
    </style>
</head>
<body>
    <div id="dv">
        曹操
    </div>
    <div style="background-color: red;color: white;width: 200px;height: 200px;">
        刘备
    </div>
</body>
</html>
