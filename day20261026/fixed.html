<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>固定定位</title>
    <style>
        img:nth-child(1){
            position: fixed;
            top: 100px;
            left: 0px;
        }
        img:nth-child(2){
            position: fixed;
            top: 100px;
            right: 0px;
        }
        body{
            height: 2000px;
        }
    </style>
</head>
<body>
    <img width="100" height="80" src="./1.jpg" />
    <img width="100" height="80" src="2.jpg" />
</body>
</html>
