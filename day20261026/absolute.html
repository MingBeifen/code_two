<!doctype html>
<html style="border:3px solid black;width:100%;height:400px;margin:20px;" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>绝对定位</title>
    <style>
      .parent {
        width: 200px;
        height: 200px;
        background-color: #ff0000;
        /* 父元素加了position属性并且值不是static的子元素，就会相对于父元素进行定位 */
        /* position: relative; */
        /* 水平方向居中 */
        margin: 0 auto;
      }
      .child {
        width: 50px;
        height: 50px;
        background-color: blue;
        position: absolute;
        top: 50px;
        left: 50px;
      }
    </style>
  </head>
  <body>
    <div class="parent">
      <div class="child"></div>
    </div>
  </body>
</html>
