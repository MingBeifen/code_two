<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>边框样式</title>
    <style>
      /* 标签选择器 division 区域*/
      div {
        width: 300px;
        height: 300px;
        /* 边框样式 */
        /* border: 1px solid black;  */

        border-style: solid;
        border-width: 1px;
        border-color: black;
        /* 圆角半径 */
        border-radius: 20%;

        /* 背景色 */
        background-color: aquamarine;
        /* 文本水平居中 */
        text-align: center;
        /* 垂直居中  设置行高的值与div的高度保持一致 */
        line-height: 300px;
      }
    </style>
  </head>
  <body>
    <div>边框样式</div>
  </body>
</html>
