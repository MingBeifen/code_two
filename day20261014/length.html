<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>长度单位</title>
  </head>
  <body style="font-size: 16px">
    <!-- em 相对父标签的font-size的长度单位 2em = 32px -->
    <div style="font-size: 2em">忘情水</div>

    <div style="width: 400px; height: 200px; border: 1px solid black">
      <div style="width: 50%; height: 50%; border: 2px dashed blue"></div>
    </div>
  </body>
</html>
