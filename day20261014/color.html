<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>颜色单位</title>
</head>
<body>
    <!-- 0-255-->
    <p style="color: rgb(0,0,0);">流浪地球</p>
    <p style="color: rgb(255,255,255);">流浪地球</p>
    <p style="color: rgb(255,0,0);">流浪地球</p>
    <!-- 透明度 -->
    <p style="color: rgb(255,0,0,0.2);">流浪地球</p>

    <hr/>
    <!-- 16进制 0-F    10 A  11 B  12 C  13 D  14 E  15 F-->
     <p style="color: #000000;">流浪地球</p>
     <p style="color: #FFFFFF;">流浪地球</p>
     <p style="color: #FF0000;">流浪地球</p>

    <p style="color: #F00;">流浪地球</p>

 
</body>
</html>
