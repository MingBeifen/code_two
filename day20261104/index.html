<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>作业</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        position: relative;
        background: #fff; 
      }

      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 250px;
        background-color: blue;
        transition: background-color 0.3s ease;
      }

      @media (max-width: 900px) {
        body::before {
          background-color: green;
        }
      }

      @media (max-width: 600px) {
        body::before {
          background-color: red;
        }
      }
    </style>
  </head>
  <body></body>
</html>
