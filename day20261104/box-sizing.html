<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>box-sizing</title>
    <style>
        div{
            width:200px;
            height: 200px;
            margin:10px;
            padding:20px;
            border:10px solid blue;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div></div>
</body>
</html>
