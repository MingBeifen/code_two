<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>弹性布局</title>
    <style>
        .flex-container {
            width: 400px;
            height: 250px;
            background-color: lightgrey;

        }

        .flex-item {
            background-color: cornflowerblue;
            height: 100px;
            width: 100px;
            float:left;
        }
    </style>
</head>

<body>

    <div class="flex-container">
        <div class="flex-item">flex item 1</div>
        <div class="flex-item" style="margin-left:50px;">flex item 2</div>
        <div class="flex-item" style="float: right;">flex item 3</div>
    </div>

</body>

</html>
