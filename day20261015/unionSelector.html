<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>并集选择器</title>
    <style>
      /* 并集选择器：多个选择器使用逗号隔开 */
      div.userInfo,
      p,
      #important {
        color: rgb(3, 125, 93);
        font-size: 20px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="userInfo">用户信息</div>
    <div class="vipInfo">会员信息</div>
    <p class="vipInfo">会员的描述信息..</p>
    <h1 id="important">重要信息</h1>
  </body>
</html>
