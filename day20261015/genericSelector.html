<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通用选择器</title>
    <style>
        /* 通用选择器：选择器之间没有空格 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
    </style>
</head>
<body style="border: 1px solid red;">
     Hello World   
</body>
</html>
