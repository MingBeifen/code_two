<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>字体样式</title>
    <style>
      .title {
        /* 设置字体名字 */
        font-family: "楷体", "微软雅黑", Arial;
        /* 设置字体大小 */
        font-size: 2em;
        /* 设置字体粗细 */
        font-weight: bold;
        /* 设置字体风格 */
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div class="title">这是一个带有样式的标题</div>
  </body>
</html>
