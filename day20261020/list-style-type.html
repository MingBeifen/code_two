<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>列表样式</title>
    <style>
      ul.disc {
        list-style-type: disc;
      }
      ul.circle {
        list-style-type: circle;
      }
      ul.square {
        list-style-type: square;
      }
      ul.none {
        list-style-type: none;
      }
      ol.decimal {
        list-style-type: decimal;
      }
      ol.lower-roman {
        list-style-type: lower-roman;
      }
      ol.upper-roman {
        list-style-type: upper-roman;
      }
      ol.lower-alpha {
        list-style-type: lower-alpha;
      }
      ol.upper-alpha {
        list-style-type: upper-alpha;
      }
    </style>
  </head>
  <body>
    <h3>无序列表样式：</h3>
    <ul class="disc">
      <li>默认黑圆点</li>
      <li>项目二</li>
    </ul>
    <ul class="circle">
      <li>空心圆点</li>
      <li>项目二</li>
    </ul>
    <ul class="square">
      <li>小黑方块</li>
      <li>项目二</li>
    </ul>
    <ul class="none">
      <li>无标记</li>
      <li>项目二</li>
    </ul>

    <h3>有序列表样式：</h3>
    <ol class="decimal">
      <li>数字排序</li>
      <li>项目二</li>
    </ol>
    <ol class="lower-roman">
      <li>小写罗马数字</li>
      <li>项目二</li>
    </ol>
    <ol class="upper-roman">
      <li>大写罗马数字</li>
      <li>项目二</li>
    </ol>
    <ol class="lower-alpha">
      <li>小写字母</li>
      <li>项目二</li>
    </ol>
    <ol class="upper-alpha">
      <li>大写字母</li>
      <li>项目二</li>
    </ol>
  </body>
</html>
