<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>块级元素</title>
    <style>
      a {
        display: block; /* 把一个内联元素变成块级元素 */
        margin: 5px;
        padding: 10px;
        background: lightblue;
        /* 去掉超链接的默认下划线 */
        text-decoration: none;
        border: 1px solid #333;
      }
    </style>
  </head>
  <body>
    <a href="#">链接1 - 现在是块级元素</a>
    <a href="#">链接2 - 独占一行</a>
    <a href="#">链接3 - 可以设置宽高边距</a>
  </body>
</html>
