<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>外边距和内边距</title>
    <style>
      .outer {
        width: 300px;
        height: 300px;
        background-color: black;
        border: 1px solid red; /* 测试时，父容器必须设置边框才有效果 */
      }
      .inner {
        width: 100px;
        height: 100px;
        background-color: aquamarine;
        /* 外边距 上 右 下 左 都是30px */
        /* margin: 30px;  */
        margin-top: 30px;
        padding: 30px; /* 内边距 上 右 下 左 都是30px */
      }
    </style>
  </head>
  <body>
    <div class="outer">
      <div class="inner">test</div>
    </div>
  </body>
</html>
