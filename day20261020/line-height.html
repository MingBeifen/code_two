<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>行高</title>
    <style>
      .title {
        /* 行高和高度值一致，则文字垂直方向居中 */
        line-height: 80px;
        height: 80px;
        /* 文字水平方向居中 */
        text-align: center;
        background-color: lightblue;
        /* 1、#333  #333333  2、red  3、rgb(100,100,100)   4、rgba(100,100,100,0.5)*/
        border: 1px solid #333;
      }
    </style>
  </head>
  <body>
    <div class="title">这段文字垂直居中</div>
  </body>
</html>
