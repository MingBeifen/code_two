<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>z-index</title>
    <style>
        #container {
            position: relative;
            width: 300px;
            height: 300px;
            background-color: gray;
        }
    </style>
</head>
<body>
    <div id="container">
        <div style="background-color: red; width: 100px; height: 100px; position: absolute; z-index: 10;"></div>
        <div style="background-color: blue; width: 100px; height: 100px; position: absolute; z-index: 2;"></div>
        <div style="background-color: yellow; width: 100px; height: 100px; position: absolute; z-index: 3;"></div>
    </div>
</body>
</html>
