<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>外边距合并</title>
    <style>
       
        #dvOne {
            width: 200px;
            height: 200px;
            border: 1px solid red;
            /* margin-bottom: 100px; */
            /* float: left;
            margin-right: 100px; */

        }

            height: 200px;
