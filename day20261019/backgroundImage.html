<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>背景图片</title>
    <style>
      .box {
        background-image: url("https://www.toopic.cn/public/uploads/small/1634268891170163426889129.jpg");
        width: 1000px;
        height: 600px;
        background-color: antiquewhite;
        /* 背景图片不重复    repeat-x   repeat-y */
        background-repeat: no-repeat;
        /* 背景图片位置  水平方向居中 center 垂直方向居中 center */
        background-position: center center;
        background-size: cover;
      }
    </style>
  </head>
  <body>
    <div class="box"></div>
  </body>
</html>
