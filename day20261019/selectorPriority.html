<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选择器的优先级</title>
    <style>
        /*!important > id选择器 > class选择器 > 标签选择器 > 通配符选择器 */
        /* 类选择器 */
        .dvClass{
            color: red;
        }
        /* id选择器 */
        #dvId{
            color: blue;
        }
        /* 通配符选择器 */
        *{
            color: green;
        }
        /* 元素选择器 */
        div{
            color: yellow !important;
        }
    </style>
</head>
<body>

    <div class="dvClass" id="dvId">功夫女足</div>
</body>
</html>
