<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇大作战 - 加速版</title>
    <style>
        /* CSS 样式部分 */
        body {
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #ecf0f1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none; 
        }

        h1 {
            margin-bottom: 5px;
            font-size: 32px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        #score-board {
            font-size: 22px;
            margin-bottom: 15px;
        }

        #game-board {
            border: 4px solid #ecf0f1;
            background-color: #000;
            box-shadow: 0 0 25px rgba(0,0,0,0.6);
            border-radius: 4px;
        }

        .controls {
            margin-top: 15px;
            font-size: 14px;
            color: #bdc3c7;
        }

        button {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 16px;
            cursor: pointer;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 6px;
            box-shadow: 0 4px 0 #27ae60;
            transition: all 0.1s;
        }
        
        button:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #27ae60;
        }
    </style>
</head>
<body>

    <h1>贪吃蛇大作战</h1>
    <div id="score-board">得分: <span id="score">0</span></div>
    
    <canvas id="game-board" width="400" height="400"></canvas>
    
    <div class="controls">使用键盘方向键 ↑ ↓ ← → 控制移动</div>
    <button onclick="resetGame()">重新开始</button>

    <script>
        // JavaScript 逻辑部分
        const canvas = document.getElementById('game-board');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');

        // 游戏配置
        const gridSize = 20; 
        const tileCount = canvas.width / gridSize; 
        
        let score = 0;
        let velocityX = 0;
        let velocityY = 0;
        let snake = [];
        let food = { x: 10, y: 10 };
        
        // 速度控制相关
        let gameLoopTimeout;
        let gameSpeed = 150; // 初始速度：150毫秒（越慢越好上手）
        const minGameSpeed = 60; // 最快速度：60毫秒（快到极限了）

        // 初始化游戏
        function initGame() {
            snake = [{ x: 10, y: 10 }]; 
            score = 0;
            velocityX = 0;
            velocityY = 0;
            gameSpeed = 150; // 重置回初始速度
            scoreElement.innerText = score;
            placeFood();
            
            if (gameLoopTimeout) clearTimeout(gameLoopTimeout);
            startGameLoop();
        }

        // 使用 setTimeout 替代 setInterval，方便动态修改时间
        function startGameLoop() {
            gameLoopTimeout = setTimeout(() => {
                update();
                draw();
                startGameLoop(); // 再次调用，形成循环
            }, gameSpeed);
        }

        // 更新游戏状态
        function update() {
            // 如果蛇还没开始动，不需要进行后续判断
            if (velocityX === 0 && velocityY === 0) return;

            const head = { x: snake[0].x + velocityX, y: snake[0].y + velocityY };

            // 检查是否撞墙
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            // 检查是否撞到自己
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head); 

            // 检查是否吃到食物
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = score;
                placeFood();
                
                // *** 核心：增加难度 ***
                // 每次吃到食物，时间减少 5 毫秒（数值越小，速度越快）
                if (gameSpeed > minGameSpeed) {
                    gameSpeed -= 5; 
                }
            } else {
                snake.pop(); // 没吃到食物，保持原长度
            }
        }

        // 绘制画面
        function draw() {
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#2ecc71';
            for (let i = 0; i < snake.length; i++) {
                ctx.fillRect(snake[i].x * gridSize + 1, snake[i].y * gridSize + 1, gridSize - 2, gridSize - 2);
            }

            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(food.x * gridSize + 1, food.y * gridSize + 1, gridSize - 2, gridSize - 2);
        }

        // 随机放置食物
        function placeFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            
            for(let part of snake) {
                if(part.x === food.x && part.y === food.y) {
                    placeFood();
                    break;
                }
            }
        }

        // 游戏结束
        function gameOver() {
            clearTimeout(gameLoopTimeout);
            alert(`游戏结束！你的得分是: ${score}`);
        }

        // 重置游戏按钮
        function resetGame() {
            initGame();
        }

        // 键盘监听
        document.addEventListener('keydown', function(event) {
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(event.code) > -1) {
                event.preventDefault();
            }

            switch (event.key) {
                case 'ArrowUp':
                    if (velocityY !== 1) { velocityX = 0; velocityY = -1; }
                    break;
                case 'ArrowDown':
                    if (velocityY !== -1) { velocityX = 0; velocityY = 1; }
                    break;
                case 'ArrowLeft':
                    if (velocityX !== 1) { velocityX = -1; velocityY = 0; }
                    break;
                case 'ArrowRight':
                    if (velocityX !== -1) { velocityX = 1; velocityY = 0; }
                    break;
            }
        });

        // 启动游戏
        initGame();
    </script>
</body>
</html>
