<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    div {
      width: 100px;
      height: 100px;
      background: black;
      position: relative;
      left: 0px;
      border-radius: 50px;
      transition: all 1s;
    }
    div:active {
        background-color: green;
        left: 500px;
    }
    hr {
        position: relative;
        top: -8px;
    }
  </style>
  <body>
    <div></div>
    <hr>
  </body>
</html>
