<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS 纯图片淡入淡出轮播</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #222;
      }

      .carousel {
        position: relative;
        width: 600px;
        height: 400px;
        overflow: hidden;
        border-radius: 10px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }

      /* 幻灯片容器：只作为定位父级，不再横向排列
         （原来用 display:flex + width:300% 把三张图并排横向拖动） */
      .slides {
        position: relative;
        width: 100%;
        height: 100%;
      }

      /* 每一屏：绝对定位铺满容器，三张图重叠在同一个位置
         重叠是淡入淡出的前提——同一时刻有多张图叠着，靠 opacity 决定谁可见 */
      .slide {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      .slide img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        /* 初始透明，显示时机交给动画控制 */
        opacity: 0;
        /* 12s 一轮，三张图各占 4s，linear 保证交叉淡化的亮度均匀 */
        animation: fade 12s infinite linear;
      }

      /* 第2张图：动画提前 8s 启动，相当于它负责第 4s–8s 这一段时间 */
      .slide:nth-child(2) img {
        animation-delay: -8s;
      }

      /* 第3张图：提前 4s 启动，负责第 8s–12s 这一段时间 */
      .slide:nth-child(3) img {
        animation-delay: -4s;
      }

      .caption {
        position: absolute;
        left: 20px;
        bottom: 20px;
        color: #fff;
        font-size: 18px;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
        opacity: 0;
        animation: captionFade 12s infinite linear;
      }

      /* 文字动画也一起错开，保证和各自的图片同步出现 */
      .slide:nth-child(2) .caption {
        animation-delay: -8s;
      }

      .slide:nth-child(3) .caption {
        animation-delay: -4s;
      }

      .dots {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 12px;
        display: flex;
        justify-content: center;
        gap: 10px;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.5);
        animation: dotActive 12s infinite linear;
      }

      .dot:nth-child(2) {
        animation-delay: -8s;
      }

      .dot:nth-child(3) {
        animation-delay: -4s;
      }

      /* ===== 淡入淡出核心 =====
         一轮 12s，每张图只在自己那 1/3 时间里不透明：
         0% → 6%：淡入（约 0.72s）
         6% → 33.33%：保持完全不透明（约 3.28s）
         33.33% → 39.33%：淡出（约 0.72s）
         39.33% → 100%：保持透明，等待下一轮
         淡入的区间正好覆盖上一张的淡出区间，两图交叠形成"交叉淡化" */
      @keyframes fade {
        0% {
          opacity: 0;
        }
        6% {
          opacity: 1;
        }
        33.33% {
          opacity: 1;
        }
        39.33% {
          opacity: 0;
        }
        100% {
          opacity: 0;
        }
      }

      /* ===== 文字淡入淡出 ===== */
      @keyframes captionFade {
        0% {
          opacity: 0;
          transform: translateY(14px);
        }
        10% {
          opacity: 1;
          transform: translateY(0);
        }
        30% {
          opacity: 1;
          transform: translateY(0);
        }
        33.33% {
          opacity: 0;
          transform: translateY(-8px);
        }
        100% {
          opacity: 0;
          transform: translateY(14px);
        }
      }

      /* ===== 圆点高亮：跟着当前显示的那张图走 ===== */
      @keyframes dotActive {
        0% {
          background: rgba(255, 255, 255, 0.9);
          transform: scale(1.3);
        }
        31% {
          background: rgba(255, 255, 255, 0.9);
          transform: scale(1.3);
        }
        33.4% {
          background: rgba(255, 255, 255, 0.5);
          transform: scale(1);
        }
        100% {
          background: rgba(255, 255, 255, 0.5);
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div class="carousel">
      <div class="slides">
        <div class="slide">
          <img
            src="https://pic.rmb.bdstatic.com/bjh/250528/dump/13497c4b003dec5586786571fe309c57.jpeg"
            alt="第一张图片"
          />
          <div class="caption">第一张图片</div>
        </div>
        <div class="slide">
          <img
            src="https://preview.qiantucdn.com/58pic/ga/Y7/H9/8f/2hr57bcsnxilov4y8gjad0zptqu93w61_PIC2018.png!qt_w320"
            alt="第二张图片"
          />
          <div class="caption">第二张图片</div>
        </div>
        <div class="slide">
          <img
            src="https://img0.baidu.com/it/u=753042523,1520460306&fm=253&app=120&f=JPEG?w=800&h=800"
            alt="第三张图片"
          />
          <div class="caption">第三张图片</div>
        </div>
      </div>
      <div class="dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>
  </body>
</html>
