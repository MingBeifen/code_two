<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>表格</title>
    <style>
        html, body{
            height: 100%;
            margin: 0%;
        }


      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <table align="center" border="1" cellspacing="0">
      <tr align="center" height="40px">
        <!--设置表格的表头-->
        <th width="70px">演员</th>
        <th width="90px">代表作</th>
      </tr>
      <tr align="center" height="40px">
        <td>成龙</td>
        <td>警察故事</td>
      </tr>
      <tr align="center" height="40px">
        <td>周星驰</td>
        <td>大话西游</td>
      </tr>
      <tr align="center" height="40px">
        <td>李连杰</td>
        <td>少林寺</td>
      </tr>
    </table>
  </body>
</html>
