<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>弹性布局</title>
    <style>
      .container {
        /* 要使用flex布局，必须在父容器上设置display样式为flex */
        display: flex;
      }
      .item {
        flex: 1; /* 每个item平均分配剩余空间 */
        background: lightblue;
        margin: 5px;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="item">项目1</div>
      <div class="item" style="flex:2">项目2</div>
      <div class="item">项目3</div>
    </div>
  </body>
</html>
