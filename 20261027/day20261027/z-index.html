<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>层叠顺序</title>
    <style>
      .container {
        position: relative;
        height: 200px;
        background-color: aqua;
      }

      .box {
        position: absolute;
        width: 100px;
        height: 100px;
        color: white;
      }

      .box1 {
        background: red;
        z-index: 1;
        top: 20px;
        left: 20px;
      }

      .box2 {
        background: blue;
        z-index: 2;
        top: 50px;
        left: 50px;
      }

      .box3 {
        background: green;
        z-index: 3;
        top: 80px;
        left: 80px;
      }
      .container > div:hover{
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box box1">Box 1</div>
      <div class="box box2">Box 2</div>
      <div class="box box3">Box 3</div>
    </div>
  </body>
</html>
