<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>浮动塌陷</title>
    <style>
      .parent {
        border: 3px solid red;
        padding: 10px;
        /* 清除浮动/溢出部分内容进行隐藏 */
        overflow: hidden;
      }
      .childOne {
        float: left;
        width: 100px;
        height: 100px;
        background: lightblue;
      }
      .childTwo {
        float: right;
        width: 100px;
        height: 100px;
        background: lightblue;
      }
    </style>
  </head>
  <body>
    <div class="parent">
      <div class="childOne">浮动子元素向左</div>
      <div class="childTwo">浮动子元素向左</div>
    </div>
    <div style="width: 100%;height: 40px;background-color: #ccc;">三国演义</div>
  </body>
</html>
