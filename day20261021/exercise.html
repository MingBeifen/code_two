<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>作业</title>
    <style>
      /* 重置网页上所有标签的默认样式(body自带了一个margin:8px;) */
      * {
        margin: 0;
        padding: 0;
        /* 设置标签在网页上占有的区域完全由该标签的width和height决定(padding会撑大标签占用的区域) */
        box-sizing: border-box;
      }
      #dv {
        width: 1000px;
        height: 830px;
        /* border: 1px solid red; */
        /* auto 自适应 使div处于body的水平中间位置 */
        margin: 0 auto;
        /* 圆角 */
        border-radius: 20px;
        /* 阴影 x轴偏移量 y轴偏移量 模糊度 透明度 */
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        padding: 45px;
      }
      body {
        padding: 20px;
      }
      h1 {
        font-size: 40px;
        /* 设置字符之间的间距 */
        letter-spacing: 5px;
        color: rgb(74, 63, 143);
      }
      table {
        width: 100%;
        /* 合并表格的边框 */
        border-collapse: collapse;
        margin-top: 30px;
      }
      th,
      td {
        border: 1px solid #ccc;
        height: 50px;
        /* 字体不加粗 */
        font-weight: normal;
        letter-spacing: 2px;
        font-size: 18px;
        /* 文本居中 */
        text-align: center;
      }
      .th {
        background-color: rgb(102, 126, 234);
        color: white;
      }
      tr:nth-child(3) {
        background-color: rgb(243, 245, 251);
      }
      tr:hover {
        background-color: rgb(232, 236, 251);
      }
      h2 {
        margin-top: 35px;
        border-left: 5px solid rgb(118, 75, 162);
        padding-left: 10px;
      }
      .dvOne {
        /* 弹性布局 */
        display: flex;
        /* 弹性布局在主轴方向(默认的主轴就是X轴)排列方式 两端对齐 */
        justify-content: space-between;
        width: 100%;
        height: 84px;
        /* border: 1px solid rgb(102, 126, 234); */
        margin-top: 30px;
        /* 设置包含的两个div之间的间隔 */
        gap: 20px;
      }
      label {
        /* 把元素变为块级元素 独占一行 */
        display: block;
        font-size: 20px;
        font-weight: bold;
      }
      .dvOne > div {
        flex: 1;
        /* border:2px solid red; */
        height: 84px;
      }
      input[type="text"],
      select {
        width: 100%;
        height: 50px;
        padding: 10px;
        font-size: 18px;
        border: 1px solid #ccc;
        transition: box-shadow 0.2s;
        border-radius: 5px;
      }
      input:focus,
      select:focus {
        outline: none;
        border: 1px solid rgb(102, 126, 234);
        box-shadow: 0 0 0 5px rgb(224, 229, 251);
      }
    </style>
  </head>
  <body>
    <!-- division 区域 -->
    <div id="dv">
      <h1 align="center">学生信息登记表</h1>
      <table>
        <tr>
          <th class="th">姓名</th>
          <th class="th">年级</th>
          <th class="th">专业</th>
          <th class="th">联系电话</th>
        </tr>
        <tr>
          <td>张三</td>
          <td>大一</td>
          <td>计算机科学</td>
          <td>138****1234</td>
        </tr>
        <tr>
          <td>李四</td>
          <td>大二</td>
          <td>软件工程</td>
          <td>139****5678</td>
        </tr>
        <tr>
          <td>王五</td>
          <td>大三</td>
          <td>信息管理</td>
          <td>137****9012</td>
        </tr>
      </table>
      <h2>填写报名信息</h2>
      <form>
        <div class="dvOne">
          <div>
            <label for="">姓名</label>
            <input type="text" placeholder="请输入姓名" />
          </div>
          <div>
            <label for="">年级</label>
            <select>
              <option value="0">请选择年级</option>
              <option value="1">大一</option>
              <option value="2">大二</option>
              <option value="3">大三</option>
              <option value="4">大四</option>
            </select>
          </div>
        </div>
      </form>
    </div>
  </body>
</html>
